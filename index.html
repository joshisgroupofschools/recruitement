<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Recruitment Portal</title>
  <style>
    :root{
      --bg:#f5f1e8;
      --paper:#fffdf8;
      --ink:#21302a;
      --muted:#66756d;
      --line:#ddd4c4;
      --brand:#1f5a46;
      --brand-dark:#154134;
      --accent:#efe2c3;
      --danger:#b24040;
      --shadow:0 20px 40px rgba(33,48,42,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Segoe UI,Tahoma,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at top left, rgba(239,226,195,.8), transparent 28%),
        linear-gradient(180deg, #fcfaf5 0%, var(--bg) 100%);
    }
    .wrap{max-width:980px;margin:0 auto;padding:18px}
    .hero,.panel{
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
    }
    .hero{
      overflow:hidden;
      background:
        linear-gradient(135deg, rgba(31,90,70,.97), rgba(71,118,96,.92)),
        var(--paper);
      color:#fff;
    }
    .hero-inner{padding:28px 22px}
    .tag{
      display:inline-flex;
      padding:8px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
      background:rgba(255,255,255,.16);
    }
    h1,h2,p{margin:0}
    h1{margin-top:14px;font-size:30px;line-height:1.12}
    .hero p{margin-top:10px;max-width:640px;line-height:1.55;color:rgba(255,255,255,.9)}
    .panel{margin-top:16px;padding:20px}
    .panel-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
    .panel-head p{margin-top:8px;color:var(--muted);line-height:1.55}
    .step-badge{
      padding:10px 14px;
      border-radius:999px;
      background:var(--accent);
      color:var(--brand-dark);
      font-size:13px;
      font-weight:700;
    }
    .roles{
      display:grid;
      gap:14px;
      margin-top:18px;
    }
    .role-card{
      border:1px solid var(--line);
      border-radius:22px;
      padding:18px;
      background:#fff;
      cursor:pointer;
      transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
    }
    .role-card:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(33,48,42,.08)}
    .role-card.selected{
      border-color:var(--brand);
      box-shadow:0 0 0 3px rgba(31,90,70,.12);
      background:#f7fbf8;
    }
    .role-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .check{
      width:28px;
      height:28px;
      border-radius:999px;
      border:1px solid var(--line);
      display:grid;
      place-items:center;
      font-weight:700;
      color:transparent;
      background:#fff;
      flex-shrink:0;
    }
    .role-card.selected .check{
      border-color:var(--brand);
      background:var(--brand);
      color:#fff;
    }
    .role-card h3{margin:0;font-size:20px}
    .role-card p{margin-top:8px;color:var(--muted);line-height:1.5}
    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:18px;
    }
    .btn{
      border:none;
      border-radius:16px;
      padding:14px 18px;
      cursor:pointer;
      font:inherit;
    }
    .btn-primary{background:var(--brand);color:#fff;font-weight:700}
    .btn-primary:hover{background:var(--brand-dark)}
    .btn-secondary{background:#efe9dc;color:var(--ink);border:1px solid var(--line)}
    .btn[disabled]{opacity:.55;cursor:not-allowed}
    .summary{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:16px;
    }
    .chip{
      padding:9px 12px;
      border-radius:999px;
      background:#e7f1eb;
      color:var(--brand-dark);
      font-size:13px;
      font-weight:700;
    }
    form{
      display:grid;
      gap:14px;
      margin-top:18px;
    }
    .field{display:flex;flex-direction:column;gap:8px}
    label{font-weight:600}
    .req{color:var(--danger)}
    input,select{
      width:100%;
      padding:13px 14px;
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      color:var(--ink);
      font:inherit;
    }
    .hint{font-size:13px;color:var(--muted)}
    .toast{
      position:fixed;
      left:50%;
      bottom:20px;
      transform:translateX(-50%);
      min-width:220px;
      max-width:calc(100vw - 24px);
      padding:14px 16px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#fff;
      box-shadow:0 12px 28px rgba(33,48,42,.14);
      display:none;
      z-index:10;
    }
    .toast.show{display:block}
    .toast.error{color:var(--danger)}
    .hidden{display:none!important}
    @media (min-width:768px){
      .wrap{padding:24px}
      .hero-inner{padding:34px}
      h1{font-size:42px}
      .roles{grid-template-columns:repeat(2,minmax(0,1fr))}
      form{grid-template-columns:repeat(2,minmax(0,1fr))}
      .full{grid-column:1/-1}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="hero-inner">
        <span class="tag">Teacher Recruitment</span>
        <h1>Apply to Joshi's Group of Schools</h1>
        <p>Select the role or roles you want first. After that, fill in your basic details and submit.</p>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>Role Applying For <span class="req">*</span></h2>
          <p>Choose one or more role cards. The admin can edit these cards any time.</p>
        </div>
        <div id="stepBadge" class="step-badge">Step 1 of 2</div>
      </div>

      <div id="roleSelectionStep">
        <div id="rolesGrid" class="roles"></div>
        <div class="toolbar">
          <button id="confirmRolesBtn" class="btn btn-primary" type="button">Confirm Selection</button>
        </div>
      </div>

      <div id="detailsStep" class="hidden">
        <h2>Applicant Details</h2>
        <div id="selectedRoles" class="summary"></div>
        <form id="applicationForm">
          <div class="field">
            <label for="fullName">Full Name <span class="req">*</span></label>
            <input id="fullName" name="fullName" type="text">
          </div>
          <div class="field">
            <label for="mobileNumber">Mobile Number <span class="req">*</span></label>
            <input id="mobileNumber" name="mobileNumber" type="tel">
          </div>
          <div class="field full">
            <label for="residentialArea">Residential Area (Like Uppal, Boduppal, Peerzadiguda) <span class="req">*</span></label>
            <input id="residentialArea" name="residentialArea" type="text">
          </div>
          <div class="field full">
            <label for="educationalQualification">Educational Qualification <span class="req">*</span></label>
            <input id="educationalQualification" name="educationalQualification" type="text">
          </div>
          <div class="field">
            <label for="teachingExperience">Teaching Experience <span class="req">*</span></label>
            <select id="teachingExperience" name="teachingExperience">
              <option value="">Select</option>
            </select>
          </div>
          <div class="field">
            <label for="currentPreviousSchool">Current or Previous School <span class="req">*</span></label>
            <input id="currentPreviousSchool" name="currentPreviousSchool" type="text">
          </div>
          <div class="field full">
            <div class="toolbar">
              <button id="backBtn" class="btn btn-secondary" type="button">Back</button>
              <button id="submitBtn" class="btn btn-primary" type="submit">Submit</button>
            </div>
          </div>
        </form>
      </div>
    </section>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyY9QQ3C8g-OFnUe0AmeH9ursYlKaFDkwMnnYBTy1Thcw2_Y9g8jgmVzEGRKJfS4VqsqA/exec';
    const state = {
      roles: [],
      experienceOptions: [],
      selectedRoleIds: []
    };

    document.addEventListener('DOMContentLoaded', init);
    document.getElementById('confirmRolesBtn').addEventListener('click', confirmRoles);
    document.getElementById('backBtn').addEventListener('click', showRoleSelection);
    document.getElementById('applicationForm').addEventListener('submit', submitApplication);

    async function init() {
      try {
        const data = await apiGet('bootstrap');
        state.roles = data.roles || [];
        state.experienceOptions = data.experienceOptions || [];
        renderRoles();
        renderExperienceOptions();
      } catch (error) {
        showToast(error.message || 'Could not load form.', true);
      }
    }

    function renderRoles() {
      const grid = document.getElementById('rolesGrid');
      grid.innerHTML = '';
      if (!state.roles.length) {
        grid.innerHTML = '<div class="hint">No roles available right now.</div>';
        return;
      }
      state.roles.forEach(role => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'role-card';
        card.dataset.roleId = role.id;
        card.innerHTML = `
          <div class="role-top">
            <div>
              <h3>${escapeHtml(role.title)}</h3>
              <p>${escapeHtml(role.description || '')}</p>
            </div>
            <div class="check">&#10003;</div>
          </div>
        `;
        card.addEventListener('click', () => toggleRole(role.id));
        grid.appendChild(card);
      });
      syncRoleSelectionUI();
    }

    function renderExperienceOptions() {
      const select = document.getElementById('teachingExperience');
      state.experienceOptions.forEach(option => {
        select.appendChild(new Option(option, option));
      });
    }

    function toggleRole(roleId) {
      const index = state.selectedRoleIds.indexOf(roleId);
      if (index === -1) {
        state.selectedRoleIds.push(roleId);
      } else {
        state.selectedRoleIds.splice(index, 1);
      }
      syncRoleSelectionUI();
    }

    function syncRoleSelectionUI() {
      document.querySelectorAll('.role-card').forEach(card => {
        card.classList.toggle('selected', state.selectedRoleIds.indexOf(card.dataset.roleId) !== -1);
      });
    }

    function confirmRoles() {
      if (!state.selectedRoleIds.length) {
        showToast('Please select at least one role.', true);
        return;
      }
      const wrap = document.getElementById('selectedRoles');
      wrap.innerHTML = '';
      state.roles
        .filter(role => state.selectedRoleIds.indexOf(role.id) !== -1)
        .forEach(role => {
          const chip = document.createElement('div');
          chip.className = 'chip';
          chip.textContent = role.title;
          wrap.appendChild(chip);
        });
      document.getElementById('roleSelectionStep').classList.add('hidden');
      document.getElementById('detailsStep').classList.remove('hidden');
      document.getElementById('stepBadge').textContent = 'Step 2 of 2';
    }

    function showRoleSelection() {
      document.getElementById('detailsStep').classList.add('hidden');
      document.getElementById('roleSelectionStep').classList.remove('hidden');
      document.getElementById('stepBadge').textContent = 'Step 1 of 2';
    }

    async function submitApplication(event) {
      event.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';
        const payload = {
          roleIds: state.selectedRoleIds.slice(),
          fullName: document.getElementById('fullName').value.trim(),
          mobileNumber: document.getElementById('mobileNumber').value.trim(),
          residentialArea: document.getElementById('residentialArea').value.trim(),
          educationalQualification: document.getElementById('educationalQualification').value.trim(),
          teachingExperience: document.getElementById('teachingExperience').value,
          currentPreviousSchool: document.getElementById('currentPreviousSchool').value.trim()
        };
        const result = await apiPost('submitApplication', { payload });
        event.target.reset();
        state.selectedRoleIds = [];
        syncRoleSelectionUI();
        showRoleSelection();
        showToast(result.message, false);
      } catch (error) {
        showToast(error.message || 'Could not submit application.', true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit';
      }
    }

    async function apiGet(action) {
      const url = new URL(API_URL);
      url.searchParams.set('action', action);
      const response = await fetch(url.toString());
      const result = await response.json();
      if (result.status !== 'success') throw new Error(result.message || 'Request failed');
      return result.data;
    }

    async function apiPost(action, body) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action }, body || {}))
      });
      const result = await response.json();
      if (result.status !== 'success') throw new Error(result.message || 'Request failed');
      return result.data;
    }

    function showToast(message, isError) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        toast.className = 'toast';
      }, 3200);
    }

    function escapeHtml(value) {
      return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
